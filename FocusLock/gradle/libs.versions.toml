navigationCompose = "2.8.0"
hilt = "2.51.1"
hilt-ext = "1.2.0"
hiltNavigationCompose = "1.2.0"
room = "2.6.1"
datastore = "1.1.1"
coroutines = "1.8.1"
workManager = "2.9.1"
lifecycleViewmodelCompose = "2.8.4"
kotlinxSerialization = "1.7.1"
junit = "4.13.2"
